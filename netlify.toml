[build]
  command = "mkdir -p dashboard && tar -xzf soares-source.tar.gz -C dashboard && sed -i 's/NETLIFY/SOARES_NETLIFY_RUNTIME/g' dashboard/src/lib/admin-store.server.ts && cd dashboard && corepack pnpm install --frozen-lockfile && npm run build"
  publish = "dashboard/dist"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[functions]
  directory = "dashboard/.netlify/functions-internal"
